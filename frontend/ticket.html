<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket - Anteiku</title>
    <link rel="icon" href="img/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/theme.js"></script>
    <script defer src="js/ticket.js"></script>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <img src="img/logo-mono.png" alt="Anteiku">
            <div>
                <h1>Anteiku</h1>
                <span class="students">Juan Cruz Reynoso - Daniela Maigua</span>
            </div>
        </div>
        <nav class="navbar">
            <button type="button" class="btn-ghost" onclick="toggleTheme()">Tema</button>
            <a href="http://localhost:3000/login" class="btn-ghost">Admin</a>
        </nav>
    </header>

    <main class="page ticket-page">
        <section class="ticket" id="ticket"></section>
        <div class="ticket-actions">
            <button type="button" id="pdfBtn" class="btn btn-primary">Descargar PDF</button>
            <a href="index.html" id="exitBtn" class="btn">Salir</a>
        </div>
    </main>

    <script src="js/jspdf.umd.min.js"></script>
</body>
</html>
